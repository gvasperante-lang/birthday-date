<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Birthday Mission 🎂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffd1dc,#d6e8ff);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
padding:30px;
border-radius:24px;
max-width:500px;
width:100%;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.15);
position:relative;
}

h1{
color:#ff5c9a;
margin-bottom:10px;
}

h2{
margin-bottom:15px;
color:#4d7cff;
}

p{
margin:12px 0;
line-height:1.5;
}

.hidden{
display:none;
}

.choice{
display:block;
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:14px;
background:#fff;
cursor:pointer;
font-size:16px;
transition:.2s;
box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.choice:hover{
transform:scale(1.02);
}

.main-btn{
padding:14px 28px;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
}

.yes{
background:#ff5c9a;
color:white;
}

.no{
background:#d9d9d9;
color:#333;
position:fixed;
z-index:999;
}

.countdown{
font-size:22px;
font-weight:bold;
margin:15px 0;
color:#4d7cff;
}

.loading{
font-size:18px;
line-height:2;
}

.heart{
position:fixed;
font-size:20px;
animation:floatUp 4s linear infinite;
opacity:.7;
pointer-events:none;
}

@keyframes floatUp{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-100px);
opacity:0;
}
}

#confetti{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
}

.confetti-piece{
position:absolute;
width:10px;
height:14px;
animation:fall 4s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}
</style>
</head>

<body>

<div class="card">

<div id="screen1">
<h1>🎂 Birthday Celeb</h1>
<h2>for my bebe 💙</h2>

<p>
Only the birthday celebrant may proceed.
</p>

<div class="countdown" id="countdown"></div>

<button class="main-btn yes" onclick="next1()">
✨ Start Mission
</button>
</div>

<div id="screen2" class="hidden">
<h2>Choose your birthday vibe ✨</h2>

<button class="choice" onclick="next2('🍣 Japanese')">🍣 Japanese </button> <button class="choice" onclick="next2('🥩 Grill + Hotpot')">🥩 Grill + Hotpot</button> <button class="choice" onclick="next2('🍽️ Buffet')">🍽️ Buffet</button> <button class="choice" onclick="next2('👨‍👩‍👧 Family Celebration')">👨‍👩‍👧 Family Celebration</button>

</div>

<div id="screen3" class="hidden">
<h2>What matters most?</h2>

<button class="choice" onclick="analyze('Shin')">❤️ Ako</button> <button class="choice" onclick="analyze('😂 Good Laughs')">😂 Good Laughs</button> <button class="choice" onclick="analyze('📸 Good Memories')">📸 Good Memories</button> <button class="choice" onclick="analyze('🍴 Good Food')">🍴 Good Food</button>

</div>

<div id="screen4" class="hidden">
<h2>🤖 Birthday Algorithm</h2>

<div class="loading" id="loadingText">
Analyzing...
</div>
</div>

<div id="screen5" class="hidden">

<h1>🎉 Results Ready!</h1>

<p>After extensive analysis...</p>

<div id="resultChoices"></div>

<br>

<p style="font-size:22px;font-weight:bold;">
Would you allow Shin to take you out on your birthday? ❤️
</p>

<br>

<button class="main-btn yes" onclick="acceptDate()">
YES ❤️
</button>

</div>


<button id="noBtn" class="main-btn no hidden">
NO
</button>

<div id="confetti"></div>

<script>

let selectedVibe = "";
let selectedPriority = "";

const birthday = new Date("June 15, 2026");

function updateCountdown(){

const now = new Date();
const diff = birthday - now;

const days = Math.ceil(diff / (1000*60*60*24));

if(days > 0){
document.getElementById("countdown").innerHTML =
days + " days until your birthday 🎉";
}else{
document.getElementById("countdown").innerHTML =
"🎂 It's Birthday Time!";
}

}

updateCountdown();

function next1(){
screen1.classList.add("hidden");
screen2.classList.remove("hidden");
}

function next2(choice){

selectedVibe = choice;

document.getElementById("screen2").classList.add("hidden");
document.getElementById("screen3").classList.remove("hidden");

}

function analyze(choice){

selectedPriority = choice;
  

screen3.classList.add("hidden");
screen4.classList.remove("hidden");

const text = document.getElementById("loadingText");

setTimeout(()=>{
text.innerHTML="Analyzing birthday preferences... ████████ 100%";
},1000);

setTimeout(()=>{
text.innerHTML="Checking compatibility with Shin... ████████ 99.9%";
},2500);

setTimeout(()=>{
text.innerHTML="Generating recommendation... ████████ 100%";
},4000);

setTimeout(()=>{
document.getElementById("screen4").classList.add("hidden");

document.getElementById("resultChoices").innerHTML = `

<p style="font-size:20px;font-weight:bold;">
Your Birthday Plan
</p>

<p>
${selectedVibe}
</p>

<p>
${selectedPriority}
</p>
`;

document.getElementById("screen5").classList.remove("hidden");

document.getElementById("noBtn").classList.remove("hidden");

moveNoButton();
},5500);

}

const noBtn = document.getElementById("noBtn");

const messages = [
"At bakit? 🙂",
"Ah, pinindot mo pala talaga",
"ANGAS MO AH 😠",
"Bakit ayaw mo mag-YES?!?!?",
"'di 'wag!!!!!!!"
];

let clickCount = 0;

function moveNoButton(){

const maxX = window.innerWidth - 130;
const maxY = window.innerHeight - 80;

noBtn.style.left =
Math.random()*maxX + "px";

noBtn.style.top =
Math.random()*maxY + "px";
}

noBtn.addEventListener("click",()=>{

clickCount++;

noBtn.innerText =
messages[clickCount % messages.length];

moveNoButton();

});

function acceptDate(){

createConfetti();

document.querySelector(".card").innerHTML = `

<h1>🎉 Mission Complete 🎉</h1>

<h2>
Congratulations Aizel!
</h2>

<p style="font-size:22px;font-weight:bold;">
You have successfully unlocked
a birthday date with your bebe!!!!! ❤️
</p>

<br>

<p>
Rewards included:
</p>

<p>
✅ Good Food
<br>
✅ Good Memories
<br>
✅ Good Company
</p>

<br>

<p>
Now we only have one important decision left...
</p>

<p>
Your Birthday Plan:
</p>

<p style="font-size:22px;">
${selectedVibe}
</p>

<p style="font-size:20px;">
${selectedPriority}
</p>


<br>

<p>
See you on June 15 💗
</p>

<p>
— Shin
</p>

`;

noBtn.remove();

}

function createConfetti(){

const container =
document.getElementById("confetti");

for(let i=0;i<180;i++){

const piece =
document.createElement("div");

piece.className =
"confetti-piece";

piece.style.left =
Math.random()*100+"vw";

piece.style.top =
"-20px";

piece.style.background =
Math.random() > .5
? "#ff5c9a"
: "#6fa8ff";

piece.style.animationDelay =
Math.random()*2+"s";

container.appendChild(piece);

}

}

for(let i=0;i<25;i++){

const heart =
document.createElement("div");

heart.className = "heart";
heart.innerHTML = "💗";

heart.style.left =
Math.random()*100+"vw";

heart.style.animationDelay =
Math.random()*5+"s";

document.body.appendChild(heart);

}
</script>

</body>
</html>
